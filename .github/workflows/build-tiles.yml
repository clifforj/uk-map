name: Build UK tiles

# Builds and uploads a versioned PMTiles archive to R2, writing a .done
# marker last so nothing downstream acts on a partial upload. Does NOT
# make anything live — promotion (writing latest.json) is a separate
# workflow (issue 3.5), so a bad build never goes live unattended.

on:
  schedule:
    - cron: '0 2 * * 3'   # Weekly, Wednesday 02:00 UTC — see docs/decisions/002-rebuild-cadence.md
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: echo "value=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve latest Planetiler release tag
        id: planetiler
        run: |
          TAG=$(curl -sSL -o /dev/null -w '%{url_effective}' \
            https://github.com/onthegomap/planetiler/releases/latest | sed 's#.*/tag/##')
          echo "Resolved Planetiler release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Shortbread is the schema decided in docs/decisions/001-tile-schema.md.
      # Pin the shortbread.yml profile to the same release tag as planetiler.jar
      # so the profile and the engine that reads it never drift apart.
      - name: Download Planetiler and the Shortbread profile
        run: |
          curl -sSL -o planetiler.jar \
            "https://github.com/onthegomap/planetiler/releases/download/${{ steps.planetiler.outputs.tag }}/planetiler.jar"
          curl -sSL -o shortbread.yml \
            "https://raw.githubusercontent.com/onthegomap/planetiler/${{ steps.planetiler.outputs.tag }}/planetiler-custommap/src/main/resources/samples/shortbread.yml"

      - name: Build PMTiles
        run: |
          START=$(date +%s)
          java -Xmx11g -jar planetiler.jar shortbread.yml \
            --download --area=united-kingdom \
            --output=uk.pmtiles \
            --storage=ram --nodemap-type=sparsearray | tee planetiler-build.log
          END=$(date +%s)
          echo "Build wall-clock: $((END - START))s"

      - name: Verify output size
        id: size
        run: |
          BYTES=$(stat -c%s uk.pmtiles)
          MIN_BYTES=$((1 * 1000 * 1000 * 1000)) # 1 GB floor — see issue 3.2
          echo "Output size: $BYTES bytes"
          if [ "$BYTES" -lt "$MIN_BYTES" ]; then
            echo "::error::uk.pmtiles is implausibly small ($BYTES bytes, floor is $MIN_BYTES) — likely a truncated or failed source download"
            exit 1
          fi
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"

      - name: Report output size
        run: ls -lh uk.pmtiles

      # Uploads the staged archive under a versioned filename and only marks
      # it complete once every upload has succeeded — see issue 3.3. Nothing
      # downstream (validation, promotion) may act on a version without its
      # .done marker present.
      - name: Upload to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          VERSION=${{ steps.version.outputs.value }}
          PLANETILER_VERSION=${{ steps.planetiler.outputs.tag }}
          OUTPUT_BYTES=${{ steps.size.outputs.bytes }}

          # Source extract date: parsed from the Geofabrik download URL Planetiler
          # logged (filename encodes the extract's own date, e.g. united-kingdom-260824.osm.pbf).
          # Falls back to the build date if the URL isn't found in the log.
          SOURCE_DATE=$(grep -oE 'download\.geofabrik\.de/europe/united-kingdom-[0-9]{6}\.osm\.pbf' planetiler-build.log \
            | head -1 | grep -oE '[0-9]{6}' || true)
          SOURCE_DATE=${SOURCE_DATE:-$VERSION}

          curl -sSL https://rclone.org/install.sh | sudo bash

          # --s3-no-check-bucket: our R2 token is scoped to object read/write only
          # (issue 2.2), not bucket management, so rclone's bucket-existence
          # check falls back to a CreateBucket call it can't make and gets a 403.
          # The bucket already exists (issue 2.1) so the check is unnecessary.
          rclone copyto uk.pmtiles "r2:${{ secrets.R2_BUCKET }}/uk-${VERSION}.pmtiles" \
            --header-upload "Cache-Control: public, max-age=31536000, immutable" \
            --header-upload "Content-Type: application/octet-stream" \
            --s3-chunk-size 64M --s3-no-check-bucket --progress

          # .done marker written last, only after the archive upload succeeds above.
          cat > done.json <<EOF
          {
            "version": "${VERSION}",
            "sha": "${GITHUB_SHA}",
            "planetiler_version": "${PLANETILER_VERSION}",
            "source_extract_date": "${SOURCE_DATE}",
            "output_bytes": ${OUTPUT_BYTES}
          }
          EOF
          rclone copyto done.json "r2:${{ secrets.R2_BUCKET }}/uk-${VERSION}.done" \
            --header-upload "Content-Type: application/json" \
            --s3-no-check-bucket
