name: Deploy demo page

# Publishes client/ (issue 5.2) to GitHub Pages. The tile hostname is kept out
# of the repo (see docs/decisions/003-cloudflare-domain.md) — client/*.
# committed source carries the __TILE_HOSTNAME__ placeholder, substituted here
# with the TILE_HOSTNAME secret only in the built, deployed artifact.

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Substitute TILE_HOSTNAME into a deploy copy
        run: |
          mkdir -p _site
          cp -r client/. _site/
          grep -rl '__TILE_HOSTNAME__' _site | xargs -r sed -i "s/__TILE_HOSTNAME__/${{ secrets.TILE_HOSTNAME }}/g"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
