name: Manual archive upload (issue 2.3)

# One-off: builds a Shortbread-schema uk.pmtiles archive and uploads it to R2
# over the S3 API, then checks it's retrievable over the custom domain. This
# exists to get a real file served over the real hostname before any of the
# automated build pipeline (issue 3.2) exists. Delete once 2.3 is done — the
# permanent, versioned build workflow belongs to issue 3.2, not here.

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Planetiler
        run: |
          curl -sSL -o planetiler.jar \
            https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      - name: Download Shortbread schema (per docs/decisions/001-tile-schema.md)
        run: |
          curl -sSL -o shortbread.yml \
            https://raw.githubusercontent.com/onthegomap/planetiler/main/planetiler-custommap/src/main/resources/samples/shortbread.yml

      - name: Build PMTiles
        run: |
          java -Xmx11g -jar planetiler.jar shortbread.yml \
            --download --area=united-kingdom \
            --output=uk.pmtiles \
            --storage=ram --nodemap-type=sparsearray

      - name: Report output size
        run: |
          ls -lh uk.pmtiles
          SIZE=$(stat -c%s uk.pmtiles)
          if [ "$SIZE" -lt 500000000 ]; then
            echo "::error::Output is implausibly small ($SIZE bytes) — likely a silent source-download failure"
            exit 1
          fi

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          NAME="uk-$(date -u +%Y%m%d).pmtiles"
          echo "ARCHIVE_NAME=$NAME" >> "$GITHUB_ENV"
          aws s3 cp uk.pmtiles "s3://${{ secrets.R2_BUCKET }}/$NAME" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "application/octet-stream"

      - name: Verify retrievable over HTTPS (custom domain)
        env:
          TILE_HOSTNAME: ${{ secrets.TILE_HOSTNAME }}
        run: |
          URL="https://$TILE_HOSTNAME/$ARCHIVE_NAME"
          echo "Checking $ARCHIVE_NAME over the custom domain..."
          curl -sS -I "$URL" | tee head.txt
          grep -qi "^HTTP/.* 200" head.txt || { echo "::warning::Did not get 200 — custom domain may not be connected to the bucket yet"; exit 1; }
          curl -sS -I -H "Range: bytes=0-1023" "$URL" | tee range.txt
          grep -qi "^HTTP/.* 206" range.txt || { echo "::warning::Did not get 206 for a range request"; exit 1; }
          echo "Archive $ARCHIVE_NAME is retrievable over HTTPS with expected headers."
