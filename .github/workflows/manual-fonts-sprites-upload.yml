name: Manual fonts and sprites upload (issue 4.4)

# One-off: downloads glyph PBFs and a sprite sheet from the VersaTiles
# projects (versatiles-fonts, versatiles-style — the font/icon assets that
# pair with the Shortbread-compatible Colorful/Neutrino styles shortlisted
# in docs/decisions/001-tile-schema.md and issue 5.1), trims the fonts to
# the Unicode ranges this map actually needs, and uploads both to R2 under
# /fonts/ and /sprites/. Delete once 4.4 is done — any repeat of this
# belongs to a permanent asset-refresh workflow, not here.

on:
  workflow_dispatch:

env:
  FONTS_RELEASE: https://github.com/versatiles-org/versatiles-fonts/releases/download/v2.2.0
  STYLE_RELEASE: https://github.com/versatiles-org/versatiles-style/releases/download/v5.13.1
  # Basic Latin, Latin-1 Supplement, Latin Extended-A/B, IPA Extensions,
  # Combining Diacritical Marks, Greek and Coptic, Cyrillic, Latin Extended
  # Additional (Welsh ẅ/ŷ-style combos), General Punctuation and Currency
  # Symbols. Covers English/Welsh/Gaelic place names plus common
  # transliterated signage without pulling in the CJK/Arabic ranges that
  # make the full Noto Sans set several hundred MB.
  FONT_RANGES: "0-255 256-511 512-767 768-1023 1024-1279 7680-7935 8192-8447"

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and trim fonts
        run: |
          set -euo pipefail
          curl -sSL -o noto_sans.tar.gz "$FONTS_RELEASE/noto_sans.tar.gz"
          mkdir -p fonts_src
          tar -xzf noto_sans.tar.gz -C fonts_src
          for weight in noto_sans_regular noto_sans_bold; do
            mkdir -p "fonts_out/$weight"
            for range in $FONT_RANGES; do
              cp "fonts_src/$weight/$range.pbf" "fonts_out/$weight/$range.pbf"
            done
          done
          du -sh fonts_out

      - name: Download sprites
        run: |
          set -euo pipefail
          curl -sSL -o sprites.tar.gz "$STYLE_RELEASE/sprites.tar.gz"
          mkdir -p sprites_out
          tar -xzf sprites.tar.gz -C sprites_out
          du -sh sprites_out

      - name: Upload fonts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          aws s3 cp fonts_out "s3://${{ secrets.R2_BUCKET }}/fonts" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --recursive \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "application/x-protobuf"

      - name: Upload sprites to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          aws s3 cp sprites_out "s3://${{ secrets.R2_BUCKET }}/sprites" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --recursive \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" --include "*.json" --content-type "application/json"
          aws s3 cp sprites_out "s3://${{ secrets.R2_BUCKET }}/sprites" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --recursive \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" --include "*.png" --content-type "image/png"

      - name: Verify retrievable over HTTPS (custom domain)
        env:
          TILE_HOSTNAME: ${{ secrets.TILE_HOSTNAME }}
        run: |
          set -euo pipefail
          for path in \
            "fonts/noto_sans_regular/0-255.pbf" \
            "sprites/basics/sprites.png" \
            "sprites/basics/sprites.json"
          do
            URL="https://$TILE_HOSTNAME/$path"
            echo "Checking $URL ..."
            curl -sS -D - -o /dev/null "$URL" | tee head.txt
            grep -qi "^HTTP/.* 200" head.txt || { echo "::error::$path did not return 200"; exit 1; }
          done

      - name: Check CORS on the new paths
        env:
          TILE_HOSTNAME: ${{ secrets.TILE_HOSTNAME }}
        run: |
          set -euo pipefail
          URL="https://$TILE_HOSTNAME/fonts/noto_sans_regular/0-255.pbf"
          curl -sS -D - -o /dev/null -H "Origin: https://example.com" "$URL" | tee cors.txt
          if grep -qi "^access-control-allow-origin:" cors.txt; then
            echo "CORS header present."
          else
            echo "::warning::No Access-Control-Allow-Origin header on $URL yet — bucket CORS policy (issue 4.2) likely not configured. Fonts/sprites are uploaded and reachable, but MapLibre in a browser will need that policy in place before it can load them cross-origin."
          fi
